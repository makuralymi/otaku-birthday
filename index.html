<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生诞绘卷 · 和谁同一天生日？二次元角色生日查询</title>
<meta name="description" content="输入你的生日，立刻看到同一天出生的动漫、轻小说、二次元游戏、Galgame 角色。立绘实时取色成一组纯色，页面主色随角色变化；支持类型筛选、收藏与 CSV 导出。数据来自 AniList / Bangumi / VNDB。">
<meta name="theme-color" content="#f2f0ec">
<meta property="og:title" content="生诞绘卷 · 二次元角色生日查询">
<meta property="og:description" content="输入生日，看看有哪些动漫 / 轻小说 / Galgame 角色与你同日出生。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f2f0ec'/><rect x='6' y='6' width='20' height='20' rx='4' fill='%2347597a'/><rect x='10' y='10' width='12' height='5' fill='%23ffffff'/></svg>">

<!-- 立绘多线路：主线路预连接，兜底线路按需建立 -->
<link rel="preconnect" href="https://s4.anilist.co" crossorigin>
<link rel="preconnect" href="https://lain.bgm.tv" crossorigin>
<link rel="preconnect" href="https://t.vndb.org" crossorigin>
<link rel="dns-prefetch" href="//s.vndb.org">
<link rel="dns-prefetch" href="//i0.wp.com">
<link rel="dns-prefetch" href="//wsrv.nl">
</head>
<body>
<div id="root"></div>
<noscript>本站需要 JavaScript 才能渲染生日查询结果。</noscript>
<script>
  // 如果这个「源码目录」被直接当静态站点发布了（没经过 vite build），
  // 浏览器会因为 MIME 不允许而拒绝加载 /src/main.jsx —— 与其白屏，不如给出修复办法。
  window.addEventListener('error', function (e) {
    var el = e && e.target;
    if (el && el.tagName === 'SCRIPT' && /\/src\/|main\.jsx/.test(el.src || '')) {
      var box = document.getElementById('root');
      if (box) {
        box.innerHTML = '<div style="max-width:640px;margin:12vh auto;padding:28px;border:1px solid #e2ded7;'
          + 'border-radius:12px;font:15px/1.8 system-ui,PingFang SC,sans-serif;color:#191820;background:#fff">'
          + '<h1 style="font-size:20px;margin:0 0 12px">这是源码目录，不是构建产物</h1>'
          + '<p style="margin:0 0 10px">浏览器拒绝加载 <code>/src/main.jsx</code>（MIME 为 text/jsx），所以页面空白。</p>'
          + '<p style="margin:0 0 6px"><b>Cloudflare Pages / Netlify / Vercel：</b>把构建命令设为 '
          + '<code>npm run build</code>，把「输出目录」设为 <code>dist</code>，然后重新部署。</p>'
          + '<p style="margin:0 0 6px"><b>本地预览：</b>先 <code>npm run build</code>，再 <code>npm run preview</code>'
          + '（或 <code>npx serve dist</code>）。</p>'
          + '<p style="margin:0"><b>想开发：</b><code>npm run dev</code>（Vite 会即时编译 .jsx）。</p>'
          + '</div>';
      }
    }
  }, true);
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
